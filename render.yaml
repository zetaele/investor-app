services:
  - type: web
    name: investor-app-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: "pnpm install --frozen-lockfile && pnpm -r build"
    startCommand: "mkdir -p /tmp/data && DATABASE_URL=/tmp/data/app.db node packages/backend/dist/db/seed.js && DATABASE_URL=/tmp/data/app.db node packages/backend/dist/app.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: /tmp/data/app.db
      - key: CORS_ORIGIN
        sync: false   # set manually in Render dashboard (your Vercel URL)
      - key: ADMIN_TOKEN
        generateValue: true
