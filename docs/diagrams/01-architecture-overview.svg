<svg width="100%" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box-purple { fill: #EEEDFE; stroke: #7F77DD; }
      .box-teal   { fill: #E1F5EE; stroke: #1D9E75; }
      .box-amber  { fill: #FAEEDA; stroke: #BA7517; }
      .box-coral  { fill: #FAECE7; stroke: #D85A30; }
      .box-blue   { fill: #E6F1FB; stroke: #378ADD; }
      .box-gray   { fill: #F1EFE8; stroke: #888780; }
      .label    { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .sublabel { font-size: 11px; fill: #555; }
      .arr  { stroke: #999; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #bbb; stroke-width: 0.8; stroke-dasharray: 4 3; fill: none; }
    </style>
  </defs>

  <!-- Frontend container -->
  <rect x="20" y="30" width="170" height="210" rx="12" class="box-teal"/>
  <text x="105" y="52" text-anchor="middle" class="label">Frontend</text>
  <text x="36" y="76"  class="sublabel">views/</text>
  <text x="44" y="93"  class="sublabel">HomeView</text>
  <text x="44" y="109" class="sublabel">InstrumentView</text>
  <text x="44" y="125" class="sublabel">CompareView</text>
  <text x="44" y="141" class="sublabel">CalendarView</text>
  <text x="44" y="157" class="sublabel">AdminView</text>
  <text x="36" y="176" class="sublabel">stores/  theme · currency</text>
  <text x="36" y="192" class="sublabel">services/  api · adminApi</text>
  <text x="36" y="208" class="sublabel">composables/  useFormat</text>

  <line x1="190" y1="130" x2="228" y2="130" class="arr"/>
  <text x="209" y="122" text-anchor="middle" class="sublabel">/api/v1</text>

  <!-- Backend container -->
  <rect x="230" y="20" width="430" height="450" rx="14" class="box-purple"/>
  <text x="445" y="44" text-anchor="middle" class="label">Backend — Fastify (app.ts)</text>

  <!-- instruments -->
  <rect x="248" y="62" width="185" height="66" rx="8" class="box-gray"/>
  <text x="340" y="82" text-anchor="middle" class="label">instruments</text>
  <text x="340" y="98" text-anchor="middle" class="sublabel">repository · service · router</text>
  <text x="340" y="114" text-anchor="middle" class="sublabel">GET /instruments</text>

  <!-- bonds -->
  <rect x="453" y="62" width="185" height="66" rx="8" class="box-gray"/>
  <text x="545" y="82" text-anchor="middle" class="label">bonds</text>
  <text x="545" y="98" text-anchor="middle" class="sublabel">calculator · service · router</text>
  <text x="545" y="114" text-anchor="middle" class="sublabel">GET /instruments/:ticker/analysis</text>

  <!-- compare -->
  <rect x="248" y="148" width="185" height="54" rx="8" class="box-gray"/>
  <text x="340" y="168" text-anchor="middle" class="label">compare</text>
  <text x="340" y="185" text-anchor="middle" class="sublabel">GET /compare?tickers=</text>

  <!-- calendar -->
  <rect x="453" y="148" width="185" height="54" rx="8" class="box-gray"/>
  <text x="545" y="168" text-anchor="middle" class="label">calendar</text>
  <text x="545" y="185" text-anchor="middle" class="sublabel">GET /calendar</text>

  <!-- fx -->
  <rect x="248" y="222" width="185" height="54" rx="8" class="box-gray"/>
  <text x="340" y="242" text-anchor="middle" class="label">fx</text>
  <text x="340" y="259" text-anchor="middle" class="sublabel">GET /fx/rates · bluelytics</text>

  <!-- admin -->
  <rect x="453" y="222" width="185" height="54" rx="8" class="box-coral"/>
  <text x="545" y="242" text-anchor="middle" class="label">admin</text>
  <text x="545" y="259" text-anchor="middle" class="sublabel">auth · service · router</text>

  <!-- byma -->
  <rect x="248" y="296" width="185" height="66" rx="8" class="box-amber"/>
  <text x="340" y="316" text-anchor="middle" class="label">byma</text>
  <text x="340" y="333" text-anchor="middle" class="sublabel">mock.client · official.client</text>
  <text x="340" y="349" text-anchor="middle" class="sublabel">price-cache.service</text>

  <!-- flow-generator -->
  <rect x="453" y="296" width="185" height="66" rx="8" class="box-gray"/>
  <text x="545" y="316" text-anchor="middle" class="label">flow-generator</text>
  <text x="545" y="333" text-anchor="middle" class="sublabel">BULLET · AMORTIZABLE · ZERO_COUPON</text>
  <text x="545" y="349" text-anchor="middle" class="sublabel">CAPITALIZABLE · CER · USD_LINKED</text>

  <!-- db -->
  <rect x="318" y="382" width="254" height="52" rx="8" class="box-blue"/>
  <text x="445" y="402" text-anchor="middle" class="label">db/ — Drizzle ORM + SQLite</text>
  <text x="445" y="420" text-anchor="middle" class="sublabel">schema · migrations · seed · index</text>

  <!-- Shared -->
  <rect x="20" y="265" width="170" height="54" rx="8" class="box-teal"/>
  <text x="105" y="285" text-anchor="middle" class="label">shared</text>
  <text x="105" y="302" text-anchor="middle" class="sublabel">types/ · schemas/ · index.ts</text>

  <line x1="105" y1="265" x2="105" y2="130" class="dash"/>
  <line x1="190" y1="292" x2="228" y2="292" class="dash"/>

  <!-- Legend -->
  <rect x="20" y="495" width="12" height="12" rx="2" class="box-teal"/>
  <text x="38" y="505" class="sublabel">Frontend / Shared</text>
  <rect x="20" y="515" width="12" height="12" rx="2" class="box-purple"/>
  <text x="38" y="525" class="sublabel">Backend</text>
  <rect x="20" y="535" width="12" height="12" rx="2" class="box-coral"/>
  <text x="38" y="545" class="sublabel">Admin (token protegido)</text>
  <rect x="20" y="555" width="12" height="12" rx="2" class="box-amber"/>
  <text x="38" y="565" class="sublabel">BYMA (mock → oficial en Fase 2)</text>
</svg>
