<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box-purple { fill: #EEEDFE; stroke: #7F77DD; }
      .box-teal   { fill: #E1F5EE; stroke: #1D9E75; }
      .box-amber  { fill: #FAEEDA; stroke: #BA7517; }
      .box-coral  { fill: #FAECE7; stroke: #D85A30; }
      .box-gray   { fill: #F1EFE8; stroke: #888780; }
      .divider    { stroke: #ccc; stroke-width: 0.8; }
      .label    { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .sublabel { font-size: 12px; fill: #555; }
      .field    { font-size: 11px; fill: #444; }
      .arr      { stroke: #999; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- instruments -->
  <rect x="40" y="40" width="210" height="210" rx="8" class="box-purple"/>
  <text x="145" y="62" text-anchor="middle" class="label">instruments</text>
  <line x1="40" y1="72" x2="250" y2="72" class="divider"/>
  <text x="56" y="90"  class="field">id  PK</text>
  <text x="56" y="108" class="field">ticker  unique</text>
  <text x="56" y="126" class="field">name</text>
  <text x="56" y="144" class="field">type  BOND | LETTER | ON</text>
  <text x="56" y="162" class="field">flowType  6 values</text>
  <text x="56" y="180" class="field">currency  ARS | USD | USD_LINKED</text>
  <text x="56" y="198" class="field">maturityDate</text>
  <text x="56" y="216" class="field">isActive</text>

  <!-- cashflows -->
  <rect x="40" y="275" width="210" height="160" rx="8" class="box-teal"/>
  <text x="145" y="297" text-anchor="middle" class="label">cashflows</text>
  <line x1="40" y1="307" x2="250" y2="307" class="divider"/>
  <text x="56" y="325" class="field">id  PK</text>
  <text x="56" y="343" class="field">instrumentId  FK</text>
  <text x="56" y="361" class="field">paymentDate</text>
  <text x="56" y="379" class="field">coupon</text>
  <text x="56" y="397" class="field">amortization</text>
  <text x="56" y="415" class="field">residual</text>

  <line x1="145" y1="250" x2="145" y2="273" class="arr"/>
  <text x="160" y="264" class="sublabel">1:N</text>

  <!-- instrument_config -->
  <rect x="290" y="40" width="200" height="230" rx="8" class="box-amber"/>
  <text x="390" y="62" text-anchor="middle" class="label">instrument_config</text>
  <line x1="290" y1="72" x2="490" y2="72" class="divider"/>
  <text x="306" y="90"  class="field">id  PK</text>
  <text x="306" y="108" class="field">instrumentId  FK</text>
  <text x="306" y="126" class="field">couponRate</text>
  <text x="306" y="144" class="field">couponFrequency</text>
  <text x="306" y="162" class="field">firstCouponDate</text>
  <text x="306" y="180" class="field">couponSchedule  JSON</text>
  <text x="306" y="198" class="field">amortizationSchedule  JSON</text>
  <text x="306" y="216" class="field">capitalizationRate</text>
  <text x="306" y="234" class="field">adjustmentCoefficient</text>

  <line x1="250" y1="145" x2="288" y2="145" class="arr"/>
  <text x="269" y="138" text-anchor="middle" class="sublabel">1:1</text>

  <!-- price_cache -->
  <rect x="290" y="295" width="200" height="140" rx="8" class="box-gray"/>
  <text x="390" y="317" text-anchor="middle" class="label">price_cache</text>
  <line x1="290" y1="327" x2="490" y2="327" class="divider"/>
  <text x="306" y="345" class="field">id  PK</text>
  <text x="306" y="363" class="field">ticker</text>
  <text x="306" y="381" class="field">price</text>
  <text x="306" y="399" class="field">fetchedAt</text>
  <text x="306" y="417" class="field">expiresAt  TTL 5 min</text>

  <!-- fx_cache -->
  <rect x="530" y="40" width="130" height="150" rx="8" class="box-gray"/>
  <text x="595" y="62" text-anchor="middle" class="label">fx_cache</text>
  <line x1="530" y1="72" x2="660" y2="72" class="divider"/>
  <text x="546" y="90"  class="field">id  PK</text>
  <text x="546" y="108" class="field">pair  ARS/USD_*</text>
  <text x="546" y="126" class="field">rate</text>
  <text x="546" y="144" class="field">fetchedAt</text>
  <text x="546" y="162" class="field">expiresAt  TTL 10 min</text>

  <!-- users — Fase 2 -->
  <rect x="530" y="215" width="130" height="130" rx="8" class="box-coral"/>
  <text x="595" y="237" text-anchor="middle" class="label">users</text>
  <text x="595" y="254" text-anchor="middle" class="sublabel">Fase 2</text>
  <line x1="530" y1="262" x2="660" y2="262" class="divider"/>
  <text x="546" y="280" class="field">id  PK</text>
  <text x="546" y="298" class="field">email  unique</text>
  <text x="546" y="316" class="field">plan  FREE|PRO|ADV</text>

  <!-- sessions — Fase 2 -->
  <rect x="530" y="370" width="130" height="100" rx="8" class="box-coral"/>
  <text x="595" y="392" text-anchor="middle" class="label">sessions</text>
  <text x="595" y="409" text-anchor="middle" class="sublabel">Fase 2</text>
  <line x1="530" y1="417" x2="660" y2="417" class="divider"/>
  <text x="546" y="435" class="field">id  UUID PK</text>
  <text x="546" y="453" class="field">userId  FK</text>

  <line x1="595" y1="345" x2="595" y2="368" class="arr"/>
  <text x="610" y="359" class="sublabel">1:N</text>

  <!-- Legend -->
  <rect x="40" y="468" width="12" height="12" rx="2" class="box-coral"/>
  <text x="58" y="479" class="sublabel">Definido, inactivo en Fase 1</text>
</svg>
