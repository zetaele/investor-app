<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box-purple { fill: #EEEDFE; stroke: #7F77DD; }
      .box-teal   { fill: #E1F5EE; stroke: #1D9E75; }
      .box-amber  { fill: #FAEEDA; stroke: #BA7517; }
      .box-coral  { fill: #FAECE7; stroke: #D85A30; }
      .box-gray   { fill: #F1EFE8; stroke: #888780; }
      .divider    { stroke: #ccc; stroke-width: 0.6; }
      .label    { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .sublabel { font-size: 11px; fill: #444; }
      .arr { stroke: #999; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- instruments -->
  <rect x="20" y="20" width="210" height="222" rx="8" class="box-purple"/>
  <text x="125" y="42" text-anchor="middle" class="label">instruments</text>
  <line x1="20" y1="54" x2="230" y2="54" class="divider"/>
  <text x="36" y="72"  class="sublabel">id  INTEGER PK</text>
  <text x="36" y="90"  class="sublabel">ticker  TEXT unique</text>
  <text x="36" y="108" class="sublabel">name  TEXT</text>
  <text x="36" y="126" class="sublabel">type  BOND | LETTER | ON</text>
  <text x="36" y="144" class="sublabel">flowType  6 valores</text>
  <text x="36" y="162" class="sublabel">currency  ARS | USD | USD_LINKED</text>
  <text x="36" y="180" class="sublabel">market · issuer</text>
  <text x="36" y="198" class="sublabel">maturityDate  TEXT ISO</text>
  <text x="36" y="216" class="sublabel">isActive  BOOLEAN</text>
  <text x="36" y="234" class="sublabel">createdAt · updatedAt</text>

  <!-- cashflows -->
  <rect x="20" y="262" width="210" height="178" rx="8" class="box-teal"/>
  <text x="125" y="284" text-anchor="middle" class="label">cashflows</text>
  <line x1="20" y1="296" x2="230" y2="296" class="divider"/>
  <text x="36" y="314" class="sublabel">id  INTEGER PK</text>
  <text x="36" y="332" class="sublabel">instrumentId  INTEGER FK</text>
  <text x="36" y="350" class="sublabel">paymentDate  TEXT ISO</text>
  <text x="36" y="368" class="sublabel">coupon  REAL</text>
  <text x="36" y="386" class="sublabel">amortization  REAL</text>
  <text x="36" y="404" class="sublabel">residual  REAL  (0–1)</text>

  <line x1="125" y1="242" x2="125" y2="260" class="arr"/>
  <text x="140" y="254" class="sublabel">1:N</text>

  <!-- instrument_config -->
  <rect x="258" y="20" width="210" height="262" rx="8" class="box-amber"/>
  <text x="363" y="42" text-anchor="middle" class="label">instrument_config</text>
  <line x1="258" y1="54" x2="468" y2="54" class="divider"/>
  <text x="274" y="72"  class="sublabel">id  INTEGER PK</text>
  <text x="274" y="90"  class="sublabel">instrumentId  INTEGER FK</text>
  <text x="274" y="108" class="sublabel">couponRate  REAL</text>
  <text x="274" y="126" class="sublabel">couponFrequency  INTEGER</text>
  <text x="274" y="144" class="sublabel">firstCouponDate  TEXT</text>
  <text x="274" y="162" class="sublabel">couponSchedule  JSON</text>
  <text x="274" y="180" class="sublabel">amortizationSchedule  JSON</text>
  <text x="274" y="198" class="sublabel">capitalizationRate  REAL</text>
  <text x="274" y="216" class="sublabel">adjustmentCoefficient  REAL</text>
  <text x="274" y="234" class="sublabel">adjustmentBase  REAL</text>
  <text x="274" y="252" class="sublabel">createdAt · updatedAt</text>

  <line x1="230" y1="130" x2="256" y2="130" class="arr"/>
  <text x="243" y="122" text-anchor="middle" class="sublabel">1:1</text>

  <!-- price_cache -->
  <rect x="258" y="302" width="210" height="138" rx="8" class="box-gray"/>
  <text x="363" y="324" text-anchor="middle" class="label">price_cache</text>
  <line x1="258" y1="336" x2="468" y2="336" class="divider"/>
  <text x="274" y="354" class="sublabel">id  INTEGER PK</text>
  <text x="274" y="372" class="sublabel">ticker  TEXT</text>
  <text x="274" y="390" class="sublabel">price  REAL</text>
  <text x="274" y="408" class="sublabel">currency  ARS | USD</text>
  <text x="274" y="426" class="sublabel">fetchedAt · expiresAt  TTL 5 min</text>

  <!-- fx_cache -->
  <rect x="496" y="20" width="164" height="138" rx="8" class="box-gray"/>
  <text x="578" y="42" text-anchor="middle" class="label">fx_cache</text>
  <line x1="496" y1="54" x2="660" y2="54" class="divider"/>
  <text x="512" y="72"  class="sublabel">id  INTEGER PK</text>
  <text x="512" y="90"  class="sublabel">pair  ARS/USD_*</text>
  <text x="512" y="108" class="sublabel">rate  REAL</text>
  <text x="512" y="126" class="sublabel">fetchedAt  TEXT</text>
  <text x="512" y="144" class="sublabel">expiresAt  TTL 10 min</text>

  <!-- users — Fase 2 -->
  <rect x="496" y="178" width="164" height="120" rx="8" class="box-coral"/>
  <text x="578" y="198" text-anchor="middle" class="label">users  ★ Fase 2</text>
  <line x1="496" y1="210" x2="660" y2="210" class="divider"/>
  <text x="512" y="228" class="sublabel">id  INTEGER PK</text>
  <text x="512" y="246" class="sublabel">email  TEXT unique</text>
  <text x="512" y="264" class="sublabel">plan  FREE|PRO|ADVANCED</text>
  <text x="512" y="282" class="sublabel">passwordHash · createdAt</text>

  <!-- sessions — Fase 2 -->
  <rect x="496" y="318" width="164" height="100" rx="8" class="box-coral"/>
  <text x="578" y="338" text-anchor="middle" class="label">sessions  ★ Fase 2</text>
  <line x1="496" y1="350" x2="660" y2="350" class="divider"/>
  <text x="512" y="368" class="sublabel">id  TEXT UUID PK</text>
  <text x="512" y="386" class="sublabel">userId  INTEGER FK</text>
  <text x="512" y="404" class="sublabel">expiresAt  TEXT</text>

  <line x1="578" y1="298" x2="578" y2="316" class="arr"/>
  <text x="592" y="310" class="sublabel">1:N</text>

  <!-- Legend -->
  <rect x="20" y="460" width="12" height="12" rx="2" class="box-coral"/>
  <text x="38" y="470" class="sublabel">★ Definido en schema, inactivo en Fase 1</text>
</svg>
