<svg width="100%" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box-purple { fill: #EEEDFE; stroke: #7F77DD; }
      .box-teal   { fill: #E1F5EE; stroke: #1D9E75; }
      .box-amber  { fill: #FAEEDA; stroke: #BA7517; }
      .box-blue   { fill: #E6F1FB; stroke: #378ADD; }
      .box-gray   { fill: #F1EFE8; stroke: #888780; }
      .label    { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .sublabel { font-size: 12px; fill: #555; }
      .arr      { stroke: #999; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .ret      { stroke: #7F77DD; stroke-width: 1; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Step 1 -->
  <rect x="40" y="40" width="180" height="56" rx="8" class="box-teal"/>
  <text x="130" y="60" text-anchor="middle" class="label">Usuario abre</text>
  <text x="130" y="78" text-anchor="middle" class="sublabel">/instrument/AL30</text>

  <line x1="130" y1="96" x2="130" y2="130" class="arr"/>

  <!-- Step 2 -->
  <rect x="40" y="132" width="180" height="56" rx="8" class="box-teal"/>
  <text x="130" y="152" text-anchor="middle" class="label">useInstrument()</text>
  <text x="130" y="170" text-anchor="middle" class="sublabel">composable + Pinia store</text>

  <line x1="220" y1="160" x2="260" y2="160" class="arr"/>
  <text x="240" y="153" text-anchor="middle" class="sublabel">GET /analysis</text>

  <!-- Step 3 -->
  <rect x="262" y="132" width="160" height="56" rx="8" class="box-purple"/>
  <text x="342" y="152" text-anchor="middle" class="label">bonds.router</text>
  <text x="342" y="170" text-anchor="middle" class="sublabel">Valida ticker + query</text>

  <line x1="342" y1="188" x2="342" y2="222" class="arr"/>

  <!-- Step 4 -->
  <rect x="262" y="224" width="160" height="56" rx="8" class="box-purple"/>
  <text x="342" y="244" text-anchor="middle" class="label">bonds.service</text>
  <text x="342" y="262" text-anchor="middle" class="sublabel">Orquesta todo</text>

  <line x1="422" y1="242" x2="460" y2="200" class="arr"/>
  <line x1="422" y1="262" x2="460" y2="280" class="arr"/>
  <line x1="342" y1="280" x2="342" y2="320" class="arr"/>
  <line x1="422" y1="252" x2="460" y2="354" class="arr"/>

  <!-- DB -->
  <rect x="462" y="172" width="178" height="56" rx="8" class="box-blue"/>
  <text x="551" y="192" text-anchor="middle" class="label">SQLite (Drizzle)</text>
  <text x="551" y="210" text-anchor="middle" class="sublabel">instruments + cashflows</text>

  <!-- Price cache -->
  <rect x="462" y="252" width="178" height="56" rx="8" class="box-amber"/>
  <text x="551" y="272" text-anchor="middle" class="label">PriceCache → BYMA</text>
  <text x="551" y="290" text-anchor="middle" class="sublabel">Caché 5 min → mock/real</text>

  <!-- FX -->
  <rect x="462" y="332" width="178" height="44" rx="8" class="box-gray"/>
  <text x="551" y="350" text-anchor="middle" class="label">fx.service</text>
  <text x="551" y="367" text-anchor="middle" class="sublabel">ARS/USD (caché 10 min)</text>

  <!-- Step 5 calculator -->
  <rect x="262" y="322" width="160" height="56" rx="8" class="box-purple"/>
  <text x="342" y="342" text-anchor="middle" class="label">bonds.calculator</text>
  <text x="342" y="360" text-anchor="middle" class="sublabel">YTM, duration, PV flows</text>

  <line x1="342" y1="378" x2="342" y2="412" class="arr"/>

  <!-- Response -->
  <rect x="262" y="414" width="160" height="56" rx="8" class="box-teal"/>
  <text x="342" y="434" text-anchor="middle" class="label">InstrumentAnalysis</text>
  <text x="342" y="452" text-anchor="middle" class="sublabel">price + calcs + cashflows</text>

  <!-- Return arrow -->
  <path d="M262 442 L130 442 L130 320" class="ret"/>
</svg>
