<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box-purple { fill: #EEEDFE; stroke: #7F77DD; }
      .box-teal   { fill: #E1F5EE; stroke: #1D9E75; }
      .box-amber  { fill: #FAEEDA; stroke: #BA7517; }
      .box-blue   { fill: #E6F1FB; stroke: #378ADD; }
      .box-gray   { fill: #F1EFE8; stroke: #888780; }
      .label    { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
      .sublabel { font-size: 11px; fill: #555; }
      .arr  { stroke: #999; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
      .ret  { stroke: #7F77DD; stroke-width: 1; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- InstrumentView -->
  <rect x="20" y="30" width="160" height="56" rx="8" class="box-teal"/>
  <text x="100" y="52" text-anchor="middle" class="label">InstrumentView</text>
  <text x="100" y="70" text-anchor="middle" class="sublabel">fetchAnalysis() via api.ts</text>

  <line x1="180" y1="58" x2="218" y2="58" class="arr"/>
  <text x="199" y="50" text-anchor="middle" class="sublabel">GET /:ticker/analysis</text>

  <!-- bonds.router -->
  <rect x="220" y="30" width="160" height="56" rx="8" class="box-purple"/>
  <text x="300" y="52" text-anchor="middle" class="label">bonds.router</text>
  <text x="300" y="70" text-anchor="middle" class="sublabel">Valida ticker + displayCurrency</text>

  <line x1="300" y1="86" x2="300" y2="118" class="arr"/>

  <!-- bonds.service -->
  <rect x="220" y="120" width="160" height="56" rx="8" class="box-purple"/>
  <text x="300" y="142" text-anchor="middle" class="label">bonds.service</text>
  <text x="300" y="160" text-anchor="middle" class="sublabel">analyzeInstrument()</text>

  <!-- arrows to sub-services -->
  <line x1="380" y1="138" x2="418" y2="96" class="arr"/>
  <line x1="380" y1="148" x2="418" y2="196" class="arr"/>
  <line x1="380" y1="158" x2="418" y2="298" class="arr"/>

  <!-- instruments.service -->
  <rect x="420" y="68" width="220" height="56" rx="8" class="box-gray"/>
  <text x="530" y="88" text-anchor="middle" class="label">instruments.service</text>
  <text x="530" y="106" text-anchor="middle" class="sublabel">getInstrument() + getInstrumentCashflows()</text>

  <!-- instruments.repository -->
  <rect x="420" y="144" width="220" height="44" rx="8" class="box-blue"/>
  <text x="530" y="162" text-anchor="middle" class="label">instruments.repository</text>
  <text x="530" y="178" text-anchor="middle" class="sublabel">SQLite — instruments + cashflows</text>

  <line x1="530" y1="124" x2="530" y2="142" class="arr"/>

  <!-- byma.price-cache.service -->
  <rect x="420" y="270" width="220" height="56" rx="8" class="box-amber"/>
  <text x="530" y="290" text-anchor="middle" class="label">byma.price-cache.service</text>
  <text x="530" y="308" text-anchor="middle" class="sublabel">Caché 5 min → mock.client / official.client</text>

  <!-- fx.service -->
  <rect x="420" y="346" width="220" height="44" rx="8" class="box-gray"/>
  <text x="530" y="364" text-anchor="middle" class="label">fx.service</text>
  <text x="530" y="380" text-anchor="middle" class="sublabel">Caché 10 min — ARS/USD (bluelytics)</text>

  <line x1="380" y1="168" x2="418" y2="368" class="arr"/>

  <!-- bonds.calculator -->
  <rect x="220" y="208" width="160" height="68" rx="8" class="box-purple"/>
  <text x="300" y="228" text-anchor="middle" class="label">bonds.calculator</text>
  <text x="300" y="246" text-anchor="middle" class="sublabel">calcYTM() Newton-Raphson</text>
  <text x="300" y="262" text-anchor="middle" class="sublabel">calcModifiedDuration() · PV flows</text>

  <line x1="300" y1="176" x2="300" y2="206" class="arr"/>
  <line x1="300" y1="276" x2="300" y2="308" class="arr"/>

  <!-- InstrumentAnalysis response -->
  <rect x="220" y="310" width="160" height="68" rx="8" class="box-teal"/>
  <text x="300" y="330" text-anchor="middle" class="label">InstrumentAnalysis</text>
  <text x="300" y="348" text-anchor="middle" class="sublabel">market price + calculations</text>
  <text x="300" y="364" text-anchor="middle" class="sublabel">+ cashflowsWithPV</text>

  <!-- Return path -->
  <path d="M220 344 L100 344 L100 86" class="ret"/>
  <text x="58" y="220" class="sublabel">JSON</text>
</svg>
